<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="cPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181B1E"/>
      <stop offset="100%" stop-color="#111315"/>
    </linearGradient>
  </defs>

  <!-- Deep canvas background -->
  <rect width="1200" height="480" rx="8" fill="#0C0D0E"/>
  <rect width="1200" height="480" rx="8" stroke="#24272A" stroke-width="1"/>

  <!-- Diagram Title Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="8" height="22" rx="2" fill="#58A6FF"/>
    <text x="18" y="17" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">ECHO CODEBASE INTELLIGENCE &amp; PERSISTENT MEMORY</text>
    <text x="540" y="16" fill="#8A9096" font-family="monospace" font-size="11">4-TIER PERSISTENCE MATRIX &amp; CONTRADICTION DETECTION</text>
  </g>

  <!-- Section 1: The 4 Memory Persistence Modes -->
  <g transform="translate(40, 75)">
    <text x="0" y="14" fill="#8A9096" font-family="monospace" font-size="10" font-weight="600">SECTION 1 // MEMORY PERSISTENCE TIERS</text>

    <!-- Mode A -->
    <g transform="translate(0, 24)">
      <rect width="265" height="170" rx="6" fill="url(#cPanel)" stroke="#24272A" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="4" rx="2" fill="#8A9096"/>
      <text x="16" y="26" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700">MODE A: EPHEMERAL</text>
      <text x="16" y="42" fill="#8A9096" font-family="monospace" font-size="9.5">ZERO-PERSISTENT MEMORY</text>
      <line x1="16" y1="52" x2="249" y2="52" stroke="#24272A" stroke-width="1"/>
      <text x="16" y="72" fill="#58A6FF" font-family="monospace" font-size="9">Target: <tspan fill="#EDEDED">Transient Node.js Heap</tspan></text>
      <text x="16" y="90" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Zero disk writes. Vanishes on process exit.</text>
      <text x="16" y="112" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Ideal for air-gapped CI/CD runners &amp; confidential audits.</text>
      <rect x="16" y="132" width="120" height="20" rx="3" fill="#1F2328"/>
      <text x="76" y="145" fill="#8A9096" font-family="monospace" font-size="8.5" text-anchor="middle">AIR-GAP SAFE</text>
    </g>

    <!-- Mode B -->
    <g transform="translate(285, 24)">
      <rect width="265" height="170" rx="6" fill="url(#cPanel)" stroke="#24272A" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="4" rx="2" fill="#58A6FF"/>
      <text x="16" y="26" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700">MODE B: LOCAL CONTEXT</text>
      <text x="16" y="42" fill="#58A6FF" font-family="monospace" font-size="9.5">REPOSITORY BOUNDARY</text>
      <line x1="16" y1="52" x2="249" y2="52" stroke="#24272A" stroke-width="1"/>
      <text x="16" y="72" fill="#58A6FF" font-family="monospace" font-size="9">Target: <tspan fill="#EDEDED">`.anvexo/context.json`</tspan></text>
      <text x="16" y="90" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Stores dependencies &amp; historical bugs in repo root.</text>
      <text x="16" y="112" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Team committable or local-only ignore.</text>
      <rect x="16" y="132" width="140" height="20" rx="3" fill="#172635" stroke="#1D4060" stroke-width="0.5"/>
      <text x="86" y="145" fill="#58A6FF" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">REPO CONTAINED</text>
    </g>

    <!-- Mode C -->
    <g transform="translate(570, 24)">
      <rect width="265" height="170" rx="6" fill="url(#cPanel)" stroke="#E54D2E" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="4" rx="2" fill="#E54D2E"/>
      <text x="16" y="26" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700">MODE C: MACHINE INTEL</text>
      <text x="16" y="42" fill="#E54D2E" font-family="monospace" font-size="9.5">CROSS-REPOSITORY (DEFAULT)</text>
      <line x1="16" y1="52" x2="249" y2="52" stroke="#24272A" stroke-width="1"/>
      <text x="16" y="72" fill="#58A6FF" font-family="monospace" font-size="9">Target: <tspan fill="#EDEDED">`~/.anvexo/storage/`</tspan></text>
      <text x="16" y="90" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Correlates recurring patterns across multiple local repos.</text>
      <text x="16" y="112" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Ideal for primary engineer workstations.</text>
      <rect x="16" y="132" width="160" height="20" rx="3" fill="#2E1815" stroke="#E54D2E" stroke-width="0.5"/>
      <text x="96" y="145" fill="#E54D2E" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">RECOMMENDED DEFAULT</text>
    </g>

    <!-- Mode D -->
    <g transform="translate(855, 24)">
      <rect width="265" height="170" rx="6" fill="url(#cPanel)" stroke="#24272A" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="4" rx="2" fill="#3FB950"/>
      <text x="16" y="26" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700">MODE D: CLOUD CONTROL</text>
      <text x="16" y="42" fill="#3FB950" font-family="monospace" font-size="9.5">ENCRYPTED TEAM STORAGE</text>
      <line x1="16" y1="52" x2="249" y2="52" stroke="#24272A" stroke-width="1"/>
      <text x="16" y="72" fill="#58A6FF" font-family="monospace" font-size="9">Target: <tspan fill="#EDEDED">User S3 / GCS Bucket</tspan></text>
      <text x="16" y="90" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Direct encrypted push/pull adapter.</text>
      <text x="16" y="112" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Zero intermediary relay servers.</text>
      <rect x="16" y="132" width="130" height="20" rx="3" fill="#142C1D" stroke="#2EA043" stroke-width="0.5"/>
      <text x="81" y="145" fill="#3FB950" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">ZERO-RELAY CLOUD</text>
    </g>
  </g>

  <!-- Section 2: Core Intelligence Subsystems -->
  <g transform="translate(40, 290)">
    <text x="0" y="14" fill="#8A9096" font-family="monospace" font-size="10" font-weight="600">SECTION 2 // ECHO CONTEXT ENGINES &amp; SUBSYSTEMS</text>

    <!-- Subsystem 1: Dependency Graph -->
    <g transform="translate(0, 24)">
      <rect width="360" height="120" rx="6" fill="url(#cPanel)" stroke="#24272A" stroke-width="1"/>
      <circle cx="20" cy="20" r="4" fill="#58A6FF"/>
      <text x="32" y="24" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700">Dependency Topology Graph</text>
      <text x="16" y="52" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Extracts dependency trees, internal module links,</text>
      <text x="16" y="68" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">and version bounds across 40+ language manifests.</text>
      <rect x="16" y="86" width="220" height="18" rx="2" fill="#181B1E"/>
      <text x="24" y="98" fill="#58A6FF" font-family="monospace" font-size="9">analyzeDependencies(rootPath)</text>
    </g>

    <!-- Subsystem 2: Git Drift -->
    <g transform="translate(380, 24)">
      <rect width="360" height="120" rx="6" fill="url(#cPanel)" stroke="#24272A" stroke-width="1"/>
      <circle cx="20" cy="20" r="4" fill="#F59E0B"/>
      <text x="32" y="24" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700">Commit Hash Drift Warning</text>
      <text x="16" y="52" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Tracks `lastIndexedCommit` against active `HEAD`.</text>
      <text x="16" y="68" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Flags stale context if code advanced before run.</text>
      <rect x="16" y="86" width="220" height="18" rx="2" fill="#181B1E"/>
      <text x="24" y="98" fill="#F59E0B" font-family="monospace" font-size="9">checkCommitDrift(currentHead)</text>
    </g>

    <!-- Subsystem 3: Contradiction Engine -->
    <g transform="translate(760, 24)">
      <rect width="360" height="120" rx="6" fill="url(#cPanel)" stroke="#E54D2E" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="20" r="4" fill="#E54D2E"/>
      <text x="32" y="24" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700">Contradiction Detection Engine</text>
      <text x="16" y="52" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">Cross-validates new hypotheses against known</text>
      <text x="16" y="68" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5">historical bugs to prevent regression re-introduction.</text>
      <rect x="16" y="86" width="240" height="18" rx="2" fill="#181B1E"/>
      <text x="24" y="98" fill="#E54D2E" font-family="monospace" font-size="9">detectContradictions(findings, bugs)</text>
    </g>
  </g>
</svg>
