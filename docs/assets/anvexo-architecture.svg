    <rect width="545" height="24" rx="6" fill="url(#layerHeader)"/>
    <text x="14" y="16" fill="#8A9096" font-family="monospace" font-size="10" font-weight="600">LAYER 4 // SANDBOXED TOOL EXECUTION (shell: false)</text>

