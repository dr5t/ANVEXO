      <text x="14" y="18" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Dependency Graph &amp; Git Drift Tracking</text>
      <text x="14" y="32" fill="#8A9096" font-family="monospace" font-size="9.5">Internal package relations · Commit hash drift warning against stale context</text>

      <!-- Contradiction Detection -->
      <rect x="0" y="96" width="517" height="38" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <text x="14" y="17" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Contradiction Detection &amp; Bug Registry</text>
      <text x="14" y="30" fill="#8A9096" font-family="monospace" font-size="9.5">Historical regression protection · Cross-validates new hypotheses</text>
    </g>
