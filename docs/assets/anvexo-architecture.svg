      <text x="14" y="20" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Investigation Orchestrator</text>
      <text x="14" y="34" fill="#8A9096" font-family="monospace" font-size="9.5">Job concurrency mutex per-repo</text>
      <text x="14" y="45" fill="#3FB950" font-family="monospace" font-size="8.5">AbortController cancellation</text>

      <!-- Evidence Ledger -->
      <rect x="840" y="0" width="250" height="52" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <text x="14" y="20" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Evidence Store &amp; Redaction</text>
      <text x="14" y="34" fill="#8A9096" font-family="monospace" font-size="9.5">Immutable UUID ledger</text>
      <text x="14" y="45" fill="#F59E0B" font-family="monospace" font-size="8.5">Regex secret scrubbing (sk-, ghp-)</text>
    </g>
  </g>

