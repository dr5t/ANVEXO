      <text x="14" y="19" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Anti-DNS &amp; Host Guard</text>
      <text x="14" y="33" fill="#8A9096" font-family="monospace" font-size="9.5">Host header check · 127.0.0.1</text>

      <!-- CSRF & Origin -->
      <rect x="560" y="0" width="260" height="44" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <text x="14" y="19" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Origin &amp; CSRF Defense</text>
      <text x="14" y="33" fill="#8A9096" font-family="monospace" font-size="9.5">Rejects untrusted foreign origins</text>

      <!-- Rate Limiter -->
      <rect x="840" y="0" width="250" height="44" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <text x="14" y="19" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Rate Limiter (300 req/min)</text>
