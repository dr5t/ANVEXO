      <!-- Tool Execution Subsystem -->
      <rect x="0" y="46" width="517" height="42" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <text x="14" y="18" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Tool Registry (Direct Process Vectors)</text>
      <text x="14" y="32" fill="#8A9096" font-family="monospace" font-size="9.5">node:child_process spawnSync · Bounded timeouts · Zero shell expansion</text>

      <!-- Providers & Skills -->
      <rect x="0" y="96" width="517" height="38" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <text x="14" y="17" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Ecosystem Integrations</text>
      <text x="14" y="30" fill="#8A9096" font-family="monospace" font-size="9.5">Offline Heuristic · Anthropic · OpenAI · Gemini · Ollama · MCP JSON-RPC</text>
    </g>
  </g>

  <!-- LAYER 5: ECHO PERSISTENT INTELLIGENCE MATRIX (RIGHT) -->
  <g transform="translate(615, 407)">
    <rect width="545" height="180" rx="6" fill="url(#archBg)" stroke="#58A6FF" stroke-opacity="0.4" stroke-width="1"/>
    <rect width="545" height="24" rx="6" fill="url(#layerHeader)"/>
    <text x="14" y="16" fill="#58A6FF" font-family="monospace" font-size="10" font-weight="700">LAYER 5 // ECHO CODEBASE INTELLIGENCE &amp; CONTEXT MATRIX</text>

    <g transform="translate(14, 34)">
      <!-- 4 Memory Modes -->
      <rect x="0" y="0" width="517" height="38" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
