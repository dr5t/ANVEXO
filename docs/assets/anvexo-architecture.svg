<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141618"/>
      <stop offset="100%" stop-color="#0E1012"/>
    </linearGradient>
    <linearGradient id="layerHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E2226"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>
  </defs>

  <!-- Deep canvas background -->
  <rect width="1200" height="620" rx="8" fill="#0C0D0E"/>
  <rect width="1200" height="620" rx="8" stroke="#24272A" stroke-width="1"/>

  <!-- Diagram Title Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="8" height="22" rx="2" fill="#E54D2E"/>
    <text x="18" y="17" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">ANVEXO SYSTEM ARCHITECTURE</text>
    <text x="360" y="16" fill="#8A9096" font-family="monospace" font-size="11">MULTI-TIER DETERMINISTIC EXECUTION &amp; ISOLATION BOUNDARIES</text>
    <rect x="1000" y="-2" width="160" height="24" rx="3" fill="#181B1E" stroke="#24272A" stroke-width="0.75"/>
    <text x="1012" y="14" fill="#E54D2E" font-family="monospace" font-size="10" font-weight="600">ZERO COVERT EGRESS</text>
  </g>

  <!-- LAYER 1: WORKSPACE & INTERFACE LAYER -->
