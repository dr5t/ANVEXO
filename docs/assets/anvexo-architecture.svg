      <text x="14" y="45" fill="#58A6FF" font-family="monospace" font-size="8.5">Deterministic non-executing scan</text>

      <!-- DAG Planner -->
      <rect x="280" y="0" width="260" height="52" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <text x="14" y="20" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600">Deterministic DAG Planner</text>
      <text x="14" y="34" fill="#8A9096" font-family="monospace" font-size="9.5">Dependency-ordered step plans</text>
      <text x="14" y="45" fill="#E54D2E" font-family="monospace" font-size="8.5">Bounded iteration count (12-15 steps)</text>

