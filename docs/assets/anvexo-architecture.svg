    <rect width="1120" height="24" rx="6" fill="url(#layerHeader)"/>
    <text x="14" y="16" fill="#8A9096" font-family="monospace" font-size="10" font-weight="600">LAYER 1 // OPERATOR INTERACTION &amp; WORKSPACES</text>

    <!-- Sub-blocks -->
    <g transform="translate(14, 32)">
      <!-- CLI Box -->
      <rect x="0" y="0" width="345" height="44" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <circle cx="16" cy="22" r="3" fill="#E54D2E"/>
      <text x="28" y="20" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600">CLI Binary Suite (`anvexo`)</text>
      <text x="28" y="34" fill="#8A9096" font-family="monospace" font-size="9.5">doctor · init · investigate · discover · context · agent</text>

      <!-- Workbench Box -->
      <rect x="370" y="0" width="350" height="44" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <circle cx="386" cy="22" r="3" fill="#58A6FF"/>
      <text x="398" y="20" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600">Split IDE Canvas Workbench</text>
      <text x="398" y="34" fill="#8A9096" font-family="monospace" font-size="9.5">Native DOM · 6 Themes · Live DAG · Custom SVG Icons</text>

      <!-- REST API Box -->
      <rect x="745" y="0" width="345" height="44" rx="4" fill="#181B1E" stroke="#2E3236" stroke-width="1"/>
      <circle cx="761" cy="22" r="3" fill="#3FB950"/>
      <text x="773" y="20" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600">HTTP REST &amp; Docs Platform</text>
      <text x="773" y="34" fill="#8A9096" font-family="monospace" font-size="9.5">`/api/*` JSON-RPC · `/docs` 10-Chapter Documentation</text>
    </g>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <g stroke="#3A3E44" stroke-width="1.25" stroke-dasharray="3 3">
    <line x1="600" y1="163" x2="600" y2="183"/>
  </g>

