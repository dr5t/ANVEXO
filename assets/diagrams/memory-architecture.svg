<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" fill="none">
  <defs>
    <linearGradient id="memBg" x1="0" y1="0" x2="920" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C0D0E"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>
  </defs>

  <rect width="920" height="340" rx="8" fill="url(#memBg)" stroke="#24272A" stroke-width="1.5"/>

  <text x="32" y="38" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ECHO MEMORY MODES &amp; PERSISTENCE MATRIX</text>
  <text x="730" y="38" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="11">FOUR-TIER ISOLATION MODEL</text>
  <line x1="32" y1="50" x2="888" y2="50" stroke="#24272A" stroke-width="1"/>

  <g transform="translate(32, 70)">
    <g transform="translate(0, 0)">
      <rect width="200" height="160" rx="6" fill="#141618" stroke="#24272A" stroke-width="1"/>
      <rect x="12" y="12" width="70" height="20" rx="3" fill="#1B1E22"/>
      <text x="47" y="26" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">MODE A</text>
      <text x="12" y="52" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="600">Zero Persistent</text>
      <text x="12" y="70" fill="#58A6FF" font-family="ui-monospace, Menlo, monospace" font-size="10">Ephemeral Heap</text>
      <line x1="12" y1="82" x2="188" y2="82" stroke="#24272A" stroke-width="1"/>
      <text x="12" y="100" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Zero disk footprint.</text>
      <text x="12" y="115" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Wiped instantly on</text>
      <text x="12" y="130" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">process termination.</text>
      <text x="12" y="148" fill="#3FB950" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Air-gapped &amp; CI safe.</text>
    </g>

    <g transform="translate(218, 0)">
      <rect width="200" height="160" rx="6" fill="#141618" stroke="#E54D2E" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="3" fill="#2E1A16"/>
      <text x="47" y="26" fill="#E54D2E" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">MODE B</text>
      <text x="12" y="52" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="600">Local Context</text>
      <text x="12" y="70" fill="#E54D2E" font-family="ui-monospace, Menlo, monospace" font-size="10">.anvexo/context.json</text>
      <line x1="12" y1="82" x2="188" y2="82" stroke="#24272A" stroke-width="1"/>
      <text x="12" y="100" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Repository-scoped.</text>
      <text x="12" y="115" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Tracks bug history,</text>
      <text x="12" y="130" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">dependency graphs,</text>
      <text x="12" y="148" fill="#EDEDED" font-family="ui-monospace, Menlo, monospace" font-size="9.5">and git commit shifts.</text>
    </g>

    <g transform="translate(436, 0)">
      <rect width="200" height="160" rx="6" fill="#141618" stroke="#24272A" stroke-width="1"/>
      <rect x="12" y="12" width="70" height="20" rx="3" fill="#1B1E22"/>
      <text x="47" y="26" fill="#58A6FF" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">MODE C</text>
      <text x="12" y="52" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="600">Machine Intelligence</text>
      <text x="12" y="70" fill="#58A6FF" font-family="ui-monospace, Menlo, monospace" font-size="10">~/.anvexo/storage/</text>
      <line x1="12" y1="82" x2="188" y2="82" stroke="#24272A" stroke-width="1"/>
      <text x="12" y="100" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Machine-level matrix.</text>
      <text x="12" y="115" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Preserves cross-repo</text>
      <text x="12" y="130" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">intelligence &amp; recurring</text>
      <text x="12" y="148" fill="#EDEDED" font-family="ui-monospace, Menlo, monospace" font-size="9.5">failure patterns.</text>
    </g>

    <g transform="translate(654, 0)">
      <rect width="202" height="160" rx="6" fill="#141618" stroke="#24272A" stroke-width="1"/>
      <rect x="12" y="12" width="70" height="20" rx="3" fill="#1B1E22"/>
      <text x="47" y="26" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">MODE D</text>
      <text x="12" y="52" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="600">User Cloud Sync</text>
      <text x="12" y="70" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="10">Direct S3 / GCS Bucket</text>
      <line x1="12" y1="82" x2="190" y2="82" stroke="#24272A" stroke-width="1"/>
      <text x="12" y="100" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Team sync adapter.</text>
      <text x="12" y="115" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Encrypted summaries.</text>
      <text x="12" y="130" fill="#8A9096" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Zero intermediary relay.</text>
      <text x="12" y="148" fill="#F59E0B" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Strictly opt-in.</text>
    </g>
  </g>

  <g transform="translate(32, 250)">
    <rect width="856" height="60" rx="6" fill="#141618" stroke="#24272A" stroke-width="1"/>
    <text x="20" y="24" fill="#E54D2E" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="1">CONTRADICTION &amp; STALE CONTEXT ENGINE</text>
    <text x="20" y="44" fill="#8A9096" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11">Detects when incoming hypotheses dispute previously verified findings, checks git commit hash drift against indexed dependency nodes, and warns of re-emergent regressions.</text>
  </g>
</svg>
